# GitLab Runner (kubernetes executor) on k3s. Registration and the
# runner-token Secret come from infra/ci (Pulumi), see ci:runners there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
spec:
  project: default
  source:
    chart: gitlab-runner
    repoURL: https://charts.gitlab.io
    targetRevision: 0.93.0
    helm:
      values: |
        gitlabUrl: https://gitlab.com/
        concurrent: 2
        rbac:
          create: true
        serviceAccount:
          create: true
        runners:
          secret: gitlab-runner-k3s
          config: |
            [[runners]]
              executor = "kubernetes"
              [runners.kubernetes]
                namespace = "{{ .Release.Namespace }}"
                image = "alpine:3.22"
                privileged = false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
