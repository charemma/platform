apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goatcounter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/charemma/platform
    targetRevision: HEAD
    path: gitops/manifests/goatcounter
  destination:
    server: https://kubernetes.default.svc
    namespace: goatcounter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
