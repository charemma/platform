apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-middlewares
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/charemma/platform
    targetRevision: HEAD
    path: gitops/manifests/traefik-middlewares
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
