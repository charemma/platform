apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charemma-web-www
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/charemma/charemma-web-security
    targetRevision: HEAD
    path: sites/www/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
