apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    chart: argocd-image-updater
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 1.2.2
    helm:
      values: |
        config:
          # Write-back commits land on main of the app repos, which triggers
          # the app's own CI, which builds a new sha tag, which the updater
          # then writes back again: a commit every two minutes. "[skip ci]"
          # makes GitHub Actions ignore the write-back push and breaks the
          # loop. Message body is the updater's default template.
          git.commit-message-template: |
            build: automatic update of {{ .AppName }}

            {{ range .AppChanges -}}
            updates image {{ .Image }} tag '{{ .OldTag }}' to '{{ .NewTag }}'
            {{ end }}
            [skip ci]
          # Register ghcr.io so private images can be polled for new tags.
          # Token lives in the ghcr-image-updater secret (argocd namespace);
          # see zeddl/docs/deployment-secrets.md for creation.
          registries:
            - name: GitHub Container Registry
              api_url: https://ghcr.io
              prefix: ghcr.io
              ping: yes
              credentials: secret:argocd/ghcr-image-updater#token
              credsexpire: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
