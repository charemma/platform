apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: charemma-web-www
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: charemma-web-www
      images:
        - alias: web
          imageName: ghcr.io/charemma/charemma-web-www:latest
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: ghcr.io/charemma/charemma-web-www
      writeBackConfig:
        method: git:secret:argocd/charemma-github
        gitConfig:
          repository: https://github.com/charemma/charemma-web-security
          branch: main
          writeBackTarget: "kustomization:."
  writeBackConfig:
    method: argocd
