apiVersion: v1
kind: Service
metadata:
  name: ollama-nodeport
  namespace: ollama
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      # Fixed, memorable port on the node. Only reachable via tailnet/LAN
      # (aiagent has no public ingress; tailnet0 is a trusted interface).
      nodePort: 31143