apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-allowlist
  namespace: ollama
spec:
  # Tailnet-only access to the Ollama API.
  #
  # Two paths reach Traefik, and each is protected differently:
  #
  # 1. LoadBalancer (100.x CGNAT, the gpt.charemma.de A record):
  #    k3s servicelb SNATs to internal pod IPs, so Traefik never sees the
  #    real peer there. These 100.x addresses are not publicly routable, so
  #    only tailnet peers can reach this path at all -- no extra filter
  #    needed. 10.42.0.0/16 (pod CIDR) therefore has to be allowed so the
  #    proxied tailnet traffic passes. Safe: every pod can already reach
  #    the ollama ClusterIP directly, so this adds no exposure.
  #
  # 2. NodePort (30838) on the public vps IP: this one the public internet
  #    CAN reach, but kube-proxy preserves the real client IP here, so the
  #    100.64.0.0/10 range blocks every non-tailnet client at the edge.
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
      - fd7a:115c:a1e0::/48
      - 10.42.0.0/16