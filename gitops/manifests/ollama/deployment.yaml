apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Runs on aiagent: always-on, arm64, and the tainted home node.
      nodeSelector:
        home-network: "true"
      tolerations:
        - key: dedicated
          value: home
          effect: NoSchedule
      # hostNetwork + OLLAMA_HOST bound to the node's Tailscale IP make the
      # API reachable ONLY via the tailnet (100.64/10 CGNAT, not publicly
      # routable). aiagent has no public IP at all, so there is nothing to
      # expose -- no ingress, no allowlist, no LoadBalancer involved.
      # gpt.charemma.de just points its A record at 100.65.75.90.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              hostPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 100.65.75.90:11434
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models