apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    # RWO PVC on local-path: a rolling update would deadlock on the volume.
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Pinned to aiagent: keeps the workload off the small VPS and gives
      # workflows the residential IP if they ever need it.
      nodeSelector:
        home-network: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: home
          effect: NoSchedule
      # The n8n image runs as uid 1000; local-path creates the volume
      # root as root, so without fsGroup the pod cannot write its config.
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.39.9
          env:
            # Kubernetes injects N8N_PORT=tcp://<clusterIP>:5678 for the
            # Service named "n8n" in this namespace, which collides with
            # n8n's own N8N_PORT setting. Setting it explicitly wins.
            - name: N8N_PORT
              value: "5678"
            # Served via the Traefik ingress with TLS, so the secure-cookie
            # default stays on. Editor and webhook URLs must advertise the
            # public host, not the in-cluster one.
            - name: N8N_HOST
              value: "n8n.charemma.de"
            - name: N8N_PROTOCOL
              value: "https"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.charemma.de"
            - name: WEBHOOK_URL
              value: "https://n8n.charemma.de/"
            # One reverse proxy (Traefik) in front; trust its X-Forwarded-For.
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: GENERIC_TIMEZONE
              value: "Europe/Athens"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            # Disable the AI assistant (build-time copilot). It would need a
            # model API key plus a code-execution sandbox (privileged DinD
            # self-hosted, or Daytona cloud) -- not worth it for now. Runtime
            # AI nodes (AI Agent, LLM chains, ...) are independent of this.
            - name: N8N_DISABLED_MODULES
              value: "instance-ai"
          ports:
            - containerPort: 5678
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            # Deliberately a single dedicated subfolder of ~/Sync on aiagent,
            # not the whole Sync tree: workflows drop invoice PDFs here and
            # syncthing distributes them. A compromised n8n can touch only
            # this folder.
            - name: rechnungen
              mountPath: /data/rechnungen
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: rechnungen
          hostPath:
            path: /home/charemma/Sync/Rechnungen-Eingang
            type: Directory
