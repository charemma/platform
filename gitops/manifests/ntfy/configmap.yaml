apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  server.yml: |
    base-url: https://ntfy.charemma.de
    listen-http: ":80"
    behind-proxy: true
    cache-file: /var/lib/ntfy/cache.db
    # 7d, not the 12h default: the phone client is always subscribed and
    # gets live pushes, but the web client only pulls history on open --
    # with 12h it missed overnight jobscout notifications entirely once
    # the browser was closed that long (2026-08-21 incident).
    cache-duration: 168h
    attachment-cache-dir: /var/lib/ntfy/attachments
    attachment-total-size-limit: 1G
    attachment-file-size-limit: 15M
    attachment-expiry-duration: 3h
    auth-file: /var/lib/ntfy/user.db
    auth-default-access: deny-all
    web-root: app
    enable-signup: false
    log-level: info
